name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 8 * * 1" # Monday, 08:00 Luxembourg time
      timezone: Europe/Luxembourg
    - cron: "0 18 * * 5" # Friday, 18:00 Luxembourg time
      timezone: Europe/Luxembourg
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: google-scholar-citations
  cancel-in-progress: false

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install citation dependencies
        run: python -m pip install scholarly pyyaml

      - name: Fetch citation counts from Google Scholar
        run: timeout 180 python bin/update_scholar_citations.py

      - name: Commit and push changed citation counts
        id: update
        run: |
          git add -- _data/citations.yml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Google Scholar citation counts are unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Google Scholar citations"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Updated citation counts from Google Scholar." >> "$GITHUB_STEP_SUMMARY"

      # GITHUB_TOKEN pushes do not trigger the push-based deployment workflow.
      - name: Rebuild the site with updated citation counts
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
