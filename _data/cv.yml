    Publications:
      - title: "RAGit: Turning Document Preprocessing into an Experimental Variable for RAG"
        authors:
          - Omar El Bachyr
          - Saad Ezzini
          - Tegawendé F. Bissyandé
          - Jacques Klein
        publisher: 33rd Asia-Pacific Software Engineering Conference (APSEC), Tool Demonstration Track (accepted, forthcoming)
        releaseDate: "2026"
        url: https://arxiv.org/abs/2610.24659
        summary:
          RAGit is an open-source workbench for comparing document preprocessing choices in retrieval-augmented generation. Configurable parsing, chunking,
          indexing, retrieval, and evaluation stages support controlled experiments, reusable artifacts, and a shared page-level evaluation across different
          retrieval units.
      - title: "LëtzCross: A Cross-Lingual Page-Level Benchmark for Multimodal Retrieval over Luxembourgish Documents"
        authors:
          - Omar El Bachyr
          - Fred Philippy
          - Laura Maria Bernardy
          - Saad Ezzini
          - Jacques Klein
          - Tegawendé F. Bissyandé
        publisher: International Conference on Language Technologies for Low-resource Languages (LaTeLL 2026, accepted)
        releaseDate: "2026"
        url: https://arxiv.org/abs/2608.21714
        summary:
          LëtzCross evaluates cross-lingual retrieval over Luxembourgish PDF pages using queries in English, French, German, and Luxembourgish. The
          benchmark combines textual and visual questions to compare text-only and page-image retrievers, and investigates how single-language and multilingual
          fine-tuning transfer across query languages.
      - title: Empirical Evaluation of PDF Parsing and Chunking for Financial Question Answering with RAG
        authors:
          - Omar El Bachyr
          - Yewei Song
          - Saad Ezzini
          - Jacques Klein
          - Tegawendé F. Bissyandé
          - Anas Zilali
          - Ulrick Ble
          - Anne Goujon
        publisher: "Proceedings of the IEEE/ACM 48th International Conference on Software Engineering: Software Engineering in Practice"
        releaseDate: "2026"
        url: https://doi.org/10.1145/3786583.3786911
        summary:
          This study examines how PDF parsing and chunking choices affect retrieval-augmented question answering over financial documents. Experiments
          on two benchmarks, including the newly introduced TableQuest dataset, compare parsers, chunking strategies, and overlap settings to guide the design
          of document-processing pipelines.
      - title: "M-CATNAT: A Multimodal dataset to analyze French tweets during natural disasters"
        authors:
          - Badreddine Farah
          - Omar El Bachyr
          - Guillaume Cleuziou
          - Anaïs Halftermeyer
          - Cécile Gracianne
          - Samuel Auclair
          - Adel Hafiane
          - Raphaël Canals
        publisher: Proceedings of the International ISCRAM Conference
        releaseDate: "2024"
        url: https://ojs.iscram.org/index.php/Proceedings/article/view/52
        summary:
          M-CATNAT introduces a French-language dataset for multimodal analysis of natural-disaster tweets. Its annotation approach treats tweet text,
          images, and their combination separately, extending crisis-management resources beyond English and supporting automated analysis of social media
          during disasters.
